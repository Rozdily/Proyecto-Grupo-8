<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Tutoría - UPDS</title>
    <!-- Bootstrap 5.3 CSS Obligatorio -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Iconos de Navegación -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* Variables y Ajustes Estéticos Nativos del Símil de tu CSS */
        :root {
            --azul-upds-institucional: #004481;
            --azul-corporativo-formulario: #002d62;
            --gris-fondo: #f4f6f9;
        }
        body {
            background-color: var(--gris-fondo);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
        }
        /* Clases específicas adaptadas para el Layout sin afectar Bootstrap */
        .bg-upds-oficial { background-color: var(--azul-upds-institucional) !important; }
        .sidebar-upds-navegacion {
            width: 260px;
            background-color: #ffffff;
            border-right: 1px solid #e0e0e0;
        }
        .enlace-menu-lateral {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            color: #555555;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .enlace-menu-lateral:hover {
            background-color: #f4f6f9;
            color: var(--azul-upds-institucional);
        }
        .enlace-menu-lateral.activo-institucional {
            background-color: #e6f0fa;
            color: var(--azul-upds-institucional);
            border-left: 4px solid var(--azul-upds-institucional);
        }

        /* --- ESTILOS INDEPENDIENTES DEL FORMULARIO DE SOLICITUD --- */
        .tarjeta-formulario-real {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            margin: 40px auto;
        }
        .formulario-titulo-real {
            color: var(--azul-corporativo-formulario);
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .formulario-subtitulo-real {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .campo-grupo-real {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .campo-grupo-real label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .input-upds-real {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            color: #333;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-upds-real:focus {
            border-color: var(--azul-corporativo-formulario);
            box-shadow: 0 0 5px rgba(0, 45, 98, 0.2);
            outline: none;
        }
        textarea.input-upds-real {
            resize: vertical;
            font-family: inherit;
            line-height: 1.5;
        }
        .fila-doble-real {
            display: flex;
            gap: 20px;
        }
        .fila-doble-real .campo-grupo-real {
            flex: 1;
        }
        .area-botones-real {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 10px;
        }
        .btn-enviar-real {
            background-color: var(--azul-corporativo-formulario);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }
        .btn-enviar-real:hover {
            background-color: #001f44;
        }
        .btn-cancelar-real {
            background-color: #f4f4f4;
            color: #333;
            border: 1px solid #ccc;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.95rem;
            text-align: center;
            transition: background-color 0.2s;
        }
        .btn-cancelar-real:hover {
            background-color: #eaeaea;
        }

        /* Ajustes Responsivos de Pantalla */
        @media (max-width: 768px) {
            .sidebar-upds-navegacion {
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid #e0e0e0;
            }
            .enlace-menu-lateral {
                padding: 8px 16px;
                white-space: nowrap;
            }
            .enlace-menu-lateral.activo-institucional {
                border-left: none !important;
                border-bottom: 3px solid var(--azul-upds-institucional);
            }
        }
        @media (max-width: 480px) {
            .fila-doble-real {
                flex-direction: column;
                gap: 0;
            }
            .tarjeta-formulario-real {
                padding: 20px;
                margin: 15px;
            }
        }
    </style>
</head>
<body class="d-flex flex-column overflow-hidden">

    <!-- Barra Nav Superior Oficial UPDS -->
    <header class="navbar navbar-dark bg-upds-oficial shadow-sm px-4 flex-nowrap" style="height: 60px; z-index: 100;">
        <div class="d-flex align-items-center gap-2">
            <span class="navbar-brand mb-0 h1 fw-black fs-4 text-white p-0">UPDS</span>
            <span class="text-white-50 fw-light">|</span>
            <span class="text-light opacity-75 small d-none d-sm-inline">Tutorías Estudiantes</span>
        </div>
        <div class="d-flex align-items-center gap-3 text-white">
            <p class="mb-0 small fw-semibold d-none d-sm-block">Jonathan Arturo</p>
            <!-- Foto de perfil oficial UPDS (user.svg) -->
            <div class="bg-white rounded-circle d-flex justify-content-center align-items-center shadow-sm" style="width: 35px; height: 35px; border: 2px solid rgba(255, 255, 255, 0.2); overflow: hidden;">
                <img src="https://upds.edu.bo" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
        </div>
    </header>
    <!-- Contenedor Portal (Layout Interno) -->
    <div class="d-flex flex-grow-1 flex-column flex-md-row overflow-hidden" style="height: calc(100vh - 60px);">
        
        <!-- Menú Lateral Responsivo -->
        <aside class="sidebar-upds-navegacion d-flex flex-column justify-content-between flex-shrink-0 h-100">
            <nav class="d-flex flex-column py-3 overflow-x-auto flex-md-nowrap flex-row">
                <a href="panel.html" class="enlace-menu-lateral">
                    <i class="fa-regular fa-user d-none d-md-inline"></i> <span>Mi Perfil</span>
                </a>
                <a href="mis_tutorias.html" class="enlace-menu-lateral">
                    <i class="fa-solid fa-book-open d-none d-md-inline"></i> <span>Mis Tutorías</span>
                </a>
                <a href="solicitudes_pendientes.html" class="enlace-menu-lateral">
                    <i class="fa-regular fa-clock d-none d-md-inline"></i> <span>Solicitudes Pendientes</span>
                </a>
                <a href="tutorias_disponibles.html" class="enlace-menu-lateral">
                    <i class="fa-solid fa-graduation-cap d-none d-md-inline"></i> <span>Tutorías Disponibles</span>
                </a>
                <a href="solicitar_tutoria.html" class="enlace-menu-lateral activo-institucional">
                    <i class="fa-regular fa-paper-plane d-none d-md-inline"></i> <span>Solicitar Tutorías</span>
                </a>
            </nav>
            
            <!-- Pie del Menú Lateral -->
            <div class="p-4 border-top border-light-subtle d-none d-md-block text-secondary small fw-bold">
                <a href="logout.html" class="text-decoration-none d-block mb-1 text-muted" style="font-size: 13px;">
                    <i class="fa-solid fa-arrow-right-from-bracket me-1"></i> Cerrar Sesión
                </a>
                <span class="text-black-50 small">Sede Tarija</span>
            </div>
        </aside>
        
        <!-- Área de Contenido Central -->
        <main class="flex-grow-1 p-4 p-md-5 overflow-y-auto">
            
            <!-- Tarjeta del Formulario -->
            <div class="tarjeta-formulario-real mx-auto">
                <h2 class="formulario-titulo-real">Nueva Solicitud de Tutoría</h2>
                <p class="formulario-subtitulo-real">Complete los campos académicos para agendar una sesión de apoyo técnico.</p>
                
                <!-- Formulario Maquetado -->
                <form action="#" method="POST">
                    
                    <!-- Selector de Materias Estático -->
                    <div class="campo-grupo-real">
                        <label for="id_materia">Asignatura o Materia</label>
                        <select name="id_materia" id="id_materia" class="input-upds-real text-secondary" required>
                            <option value="" disabled selected>Seleccione la materia que requiere apoyo...</option>
                            <option value="1">Análisis Numérico</option>
                            <option value="2">Base de Datos I</option>
                            <option value="3">Estructuras de Datos</option>
                            <option value="4">Sistemas Operativos I</option>
                        </select>
                    </div>

                    <!-- Fila Doble: Fecha y Hora -->
                    <div class="fila-doble-real">
                        <div class="campo-grupo-real">
                            <label for="fecha_solicitada">Fecha Tentativa</label>
                            <input type="date" name="fecha_solicitada" id="fecha_solicitada" class="input-upds-real text-secondary" min="2026-09-25" required>
                        </div>
                        <div class="campo-grupo-real">
                            <label for="hora_solicitada">Hora Solicitada</label>
                            <input type="time" name="hora_solicitada" id="hora_solicitada" class="input-upds-real text-secondary" required>
                        </div>
                    </div>

                    <!-- Motivo -->
                    <div class="campo-grupo-real">
                        <label for="motivo">Motivo o Temas a Tratar</label>
                        <textarea name="motivo" id="motivo" class="input-upds-real" rows="4" placeholder="Ej: Dudas con el modelado de bases de datos relacionales y consultas con JOINs..." required></textarea>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="area-botones-real">
                        <a href="panel.html" class="btn-cancelar-real rounded">Cancelar</a>
                        <button type="submit" class="btn-enviar-real rounded fw-bold">Enviar Solicitud</button>
                    </div>

                </form>
            </div>
            
        </main>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
