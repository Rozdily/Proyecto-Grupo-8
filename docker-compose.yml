services:
  web:
    build: .
    container_name: tecnologias_web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=db_tutorias_upds
      - DB_USER=administrador
      - DB_PASS=grupo8
      - REGISTRO_REQUIERE_APROBACION=true
      - REGISTRO_DOMINIO_PERMITIDO=upds.edu.bo
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: tecnologias_db
    restart: always
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_grupo8
      MYSQL_DATABASE: db_tutorias_upds
      MYSQL_USER: administrador
      MYSQL_PASSWORD: grupo8
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tecnologias_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_grupo8
    depends_on:
      - db

volumes:
  mysql_data:
